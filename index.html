<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Práctica - Benito Santos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilo del proyecto -->
    <link rel="stylesheet" href="../estilo.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Benito Santos</a>
    </div>
</nav>

<!-- HEADER -->
<header class="fondo text-center text-white p-5">
    <h1>Evaluación Escrita</h1>
    <p>Empresa de Diseño de Moda</p>
</header>

<!-- PRODUCTOS -->
<section class="container mt-5">
    <h2 class="text-center">Colección</h2>

    <div class="row mt-4" id="productos"></div>
</section>

<!-- CARRITO -->
<section class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4>Carrito</h4>
        </div>
        <div class="card-body">
            <ul id="carrito" class="list-group mb-3"></ul>
            <h5>Total: $<span id="total">0.00</span></h5>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-4">
    <p>© 2026 - TecNM Campus Pachuca - Programación Web</p>
</footer>

<!-- JS -->
<script>
/* ============================
   PRODUCTOS
============================ */
const productos = [
    { id: 1, nombre: "Vestido de Gala", precio: 15000, imagen: "vestido1.png" },
    { id: 2, nombre: "Alta Costura", precio: 22000, imagen: "vestido2.png" },
    { id: 3, nombre: "Diseño Exclusivo", precio: 18000, imagen: "vestido3.png" },
    { id: 4, nombre: "Vestido de Noche", precio: 14000, imagen: "vestido4.png" },
    { id: 5, nombre: "Colección Novia", precio: 30000, imagen: "vestido5.png" }
];

let carrito = [];

/* ============================
   MOSTRAR PRODUCTOS
============================ */
function mostrarProductos() {
    const contenedor = document.getElementById("productos");
    contenedor.innerHTML = "";

    productos.forEach(producto => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";

        col.innerHTML = `
            <div class="card caja">
                <img src="${producto.imagen}" class="card-img-top">
                <div class="card-body text-center">
                    <h5>${producto.nombre}</h5>
                    <p>$${producto.precio.toFixed(2)}</p>
                    <button class="btn btn-primary agregar" data-id="${producto.id}">
                        Agregar
                    </button>
                </div>
            </div>
        `;
        contenedor.appendChild(col);
    });

    activarBotones();
}

/* ============================
   EVENT HANDLING (VIBE ENCODING)
============================ */
function activarBotones() {
    document.querySelectorAll(".agregar").forEach(btn => {
        btn.addEventListener("click", () => {
            agregarCarrito(parseInt(btn.dataset.id));
        });
    });
}

/* ============================
   AGREGAR AL CARRITO
============================ */
function agregarCarrito(id) {
    const producto = productos.find(p => p.id === id);
    carrito.push(producto);
    mostrarCarrito();
}

/* ============================
   MOSTRAR CARRITO + ELIMINAR
============================ */
function mostrarCarrito() {
    const lista = document.getElementById("carrito");
    const totalHTML = document.getElementById("total");
    lista.innerHTML = "";

    let total = 0;

    carrito.forEach((item, index) => {
        total += item.precio;

        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between";

        li.innerHTML = `
            ${item.nombre} - $${item.precio.toFixed(2)}
            <button class="btn btn-danger btn-sm eliminar">Eliminar</button>
        `;

        li.querySelector(".eliminar").addEventListener("click", () => {
            carrito.splice(index, 1);
            mostrarCarrito();
        });

        lista.appendChild(li);
    });

    totalHTML.textContent = total.toFixed(2);
}

/* ============================
   INICIALIZAR
============================ */
mostrarProductos();

</script>

</body>
</html>
